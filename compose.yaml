services:
  pipe-server:
    build:
      context: .
      dockerfile: Containerfile
    image: agent-pipe-server:dev
    ports:
      - "${AIPIPE_PORT:-8080}:8080"
    environment:
      AIPIPE_ADDR: ":8080"
      AIPIPE_DB: "/data/pipe.db"
      AIPIPE_AUTH_TOKEN: "${AIPIPE_AUTH_TOKEN:-}"
      AIPIPE_CLIENT_TOKENS: "${AIPIPE_CLIENT_TOKENS:-}"
      AIPIPE_CLIENT_TOKENS_FILE: "${AIPIPE_CLIENT_TOKENS_FILE:-}"
    volumes:
      - ai-pipe-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  ai-pipe-data:
